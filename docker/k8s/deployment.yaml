apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor
  labels:
    app: doctor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor
  template:
    metadata:
      labels:
        app: doctor
    spec:
      containers:
        - name: doctor
          image: your-registry/doctor:latest
          ports:
            - containerPort: 8000
          env:
            - name: DOCTOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: doctor-secrets
                  key: api-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: doctor-secrets
                  key: anthropic-key
            - name: MAX_CONCURRENT_RUNS
              value: "10"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: workspace
              mountPath: /app/workspace
      volumes:
        - name: workspace
          emptyDir: {}
